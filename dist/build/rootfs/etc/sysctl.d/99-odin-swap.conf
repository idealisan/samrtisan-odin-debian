# swap 相关内核参数
#
# 背景（2026-09-05）：
#   本机可用内存只有 3.46 GiB（见 reports/035）。之前这一项是 20，理由是
#   "eMMC 又慢又磨损，尽量晚点换出" —— 但那时 eMMC swapfile 根本建不起来
#   （根分区 ext4 关了 extents，而 swapfile 走 iomap 需要 extents），
#   所以那个顾虑一直是空谈。
#
#   现在 lk2nd 有了只读 extents 支持（lk2nd/0005，见 reports/036），根分区开得起
#   extents，于是改成两级：
#       zram     512 MiB，优先级 100   ← 打底，接住"温"页
#       swapfile  4 GiB，优先级 10     ← 撑峰值（odin-swap.sh）
#
#   80 的含义：内存用到一定程度就把不活跃的页往外挪，别等到快 OOM 才动手 ——
#   对 3.46 GiB 的机器来说，早点换出换来的是"峰值时还能跑"，而不是"卡一下"。
#   （100 会把什么鸡毛蒜皮都往外塞，60 又偏保守，80 是折中。）
vm.swappiness=80
# 更倾向保留目录/文件缓存（跑 GUI 时体感更好）
vm.vfs_cache_pressure=50
