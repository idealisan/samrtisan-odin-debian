# 2026-09-05 改：swap 的载体从"eMMC 上的 swapfile"换成了 **zram**（压缩内存）。
#
# 原来写 20 的理由是"eMMC 又慢又磨损，尽量晚点换出"。但：
#   1. eMMC 上的 swapfile 在本机**根本建不起来**（根分区 ext4 关了 extents，
#      swapfile 需要 extents），所以那个'磨损'的顾虑一直是空谈；
#   2. zram 是**内存**，不涉及闪存磨损，而且比 eMMC 快几个数量级。
#
# zram 上常见的建议是 80~100：早点把不活跃的页压进 zram，
# 反而能给文件缓存腾出更多物理内存，比等到快 OOM 再换出更从容。
# 这里取 80 —— 留一点余量，不至于像 100 那样什么鸡毛蒜皮都往 zram 里塞。
vm.swappiness=80
# 更倾向保留目录/文件缓存（跑 GUI 时体感更好）
vm.vfs_cache_pressure=50
