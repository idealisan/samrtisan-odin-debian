# NTP 服务器：补一批中国大陆可达的。
#
# 为什么需要这一段（实机）：
#   不写的话 systemd-timesyncd 用它内置的 0/1/2/3.debian.pool.ntp.org。
#   这台机器（以及国内大多数网络）连这些服务器常常得不到响应，表现为
#     systemctl status systemd-timesyncd  →  Status: "Idle."
#     timedatectl                          →  System clock synchronized: no
#   于是系统时间一直停在 systemd 内置 epoch 顶出来的那个错误值上，
#   只能手工 date -s 校正（用户实测正是如此）。
#
# 这里只做**追加**：systemd-timesyncd 会按配置顺序尝试，并在多个可用服务器里
# 挑最优的一个，写死哪一家都不如多给几个候选。
# 想改回默认值：删掉本文件即可（/etc/systemd/timesyncd.conf 里没有 NTP=）。
[Time]
NTP=ntp.aliyun.com ntp1.aliyun.com ntp.tencent.com cn.pool.ntp.org 0.debian.pool.ntp.org
FallbackNTP=time.cloudflare.com time.google.com
