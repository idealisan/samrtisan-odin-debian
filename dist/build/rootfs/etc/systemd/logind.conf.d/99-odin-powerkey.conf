# 手机放在衣兜、包里，或者随手一放，电源键极易被误触。
# 一旦触发关机，这台设备就只剩 USB 网络这一条生命线（没有可用的屏幕交互、
# 也没有接串口），排查与救援都很被动 —— 所以软件侧一律不响应按键的电源动作。
#
# 把 systemd-logind 对**所有**按键的电源动作全部设为 ignore：
# 短按、长按、重启键、挂起键、休眠键，统统不动作。
#
# 仍然保留、且**不受本文件影响**的是硬件级的长按强制重启 ——
# 那是 PMIC（PM8941 的 PON）在固件层面做的，按住约 10 秒以上直接复位，
# 与 Linux 是否在运行、logind 怎么配都无关。真需要硬重启就用它。
#
# 另注：ignore 只关掉 logind 的"动作"，不影响按键本身的唤醒能力 ——
# 电源键仍可以把系统从挂起中唤醒（那是内核 input 层的行为，与本配置无关）。
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
