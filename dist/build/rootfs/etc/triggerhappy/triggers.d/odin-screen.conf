# 电源键 = 开关屏幕（不是关机）
#
# 语法：<按键名> <值> <命令>
#   值 1 = 按下。这里只在按下时触发；抬起（0）和长按（2）都不绑，
#   免得一次按键连着执行两遍、把刚开的屏又关掉。
#
# 为什么不用 udev：udev 只在设备插拔时触发，监听不到按键事件。
# triggerhappy 是专门干这个的常驻监听进程。
#
# 为什么 logind 不管这事：见 /etc/systemd/logind.conf.d/99-odin-powerkey.conf，
# 那边把所有电源动作都设成 ignore 了（防兜里误触关机）。这里只是"借用"按键。
KEY_POWER	1	/usr/local/sbin/odin-screen-toggle.sh
