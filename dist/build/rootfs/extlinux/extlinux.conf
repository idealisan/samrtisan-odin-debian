# ODIN Debian (mainline 6.19) — 双 label 引导
#
#   l0       完整版：Type-C 角色切换 + OTG host（最终目标状态）
#   l0-safe  安全版：dr_mode=peripheral，UDC 恒在，USB 网络/SSH 不依赖
#            Type-C 角色判定；代价是彻底没有 OTG host。
#
# 【首刷默认 l0-safe】—— 2026-09-03 改回，理由见下面"注意 5"。
# 拿到 SSH、确认整机可用后，再按下面那行切成 l0 拿 OTG。
#
# 切换方法（系统内，l0-safe 或 l0 都能进）：
#     sudo sed -i 's/^default .*/default l0/' /extlinux/extlinux.conf && sudo reboot
#
# 注意 1：lk2nd 的 extlinux 解析里 fdt 与 fdtdir **互斥**
#   （lk2nd/boot/extlinux.c:394-434：有 fdtdir 时用 lk2nd,dtb-files 拼路径并覆盖 fdt）
#   所以两个 label 都只写 fdt、不写 fdtdir。
#
# 注意 2：两个 label 都**必须**用显式 fdt 指向 odin DTB，不能用 fdtdir。
#   原因：lk2nd 的 QCDT 表里同时存在 odin(board-id <0x0b 0x01>) 与
#   msm8953-xiaomi-markw(<0x1000b 0x01>)；两者 variant_id 都是 0x0b
#   （VARIANT_MASK=0xff，高位是 major/minor）。若 lk2nd 把票投给 markw，
#   fdtdir 就会去找 /boot/dtbs/qcom/msm8953-xiaomi-markw.dtb —— 镜像里没有这个
#   文件 ⇒ 启动失败。显式 fdt 则无论 lk2nd 选中谁都能起。
#
# 注意 3：这里用的是**面板写死 FT8716** 的一对 DTB（*-ft8716*.dtb），不是自动识别版。
#   历史：2026-08-29 实机点亮屏幕时，靠的是 DTB 里写死 compatible="smartisan,odin-ft8716"，
#   而不是 lk2nd 的面板自动替换——因为当时 boot 分区还是未精简的 lk2nd（选中 markw，
#   占位 compatible "smartisan,odin-panel" 无人替换 ⇒ 内核无驱动匹配 ⇒ 无屏）。
#
#   本次发布同时把精简版 lk2nd（去掉 markw，强制命中 odin）刷进 boot，
#   于是有两条独立的路径都能得到 FT8716：
#      路径 A  DTB 写死（本配置）——不依赖 lk2nd 选谁，必然生效
#      路径 B  lk2nd 选中 odin ⇒ 自动把占位替换成真实面板
#   两者结果一致，互为保险。若将来换屏要恢复自动识别，把 fdt 换成
#   msm8953-smartisan-odin.dtb / msm8953-smartisan-odin-norolesw.dtb 即可
#   （四个 DTB 都随镜像发布）。
#
# 注意 4：append 末尾的 console=tty0 不能少——它是控制台上屏的开关。
#   少了它，屏幕上只有背光没有登录提示（实机踩过，看起来像"屏没点亮"）。
#
# 注意 5：首刷默认必须是 l0-safe，不能用 l0。
#   l0 依赖 Type-C 角色切换，而这条链路在 2026-09-02 22:00 前后被整体重写过
#   （fc3e971：删掉 FUSB301 与 SMBCHG OTG boost 两个内核补丁共 665 行，
#    新增 qcom-smbchg 的 usb-role-switch 补丁，改设备树 89 行与内核配置），
#   WORKLOG 里**没有任何真机验证记录**。
#   SSH 是本机唯一的远程生命线：角色切换一旦不工作 ⇒ 无 usb0 ⇒ 无 172.16.42.1
#   ⇒ 无 SSH，而无屏设备此时只剩 UART。l0-safe 的 dr_mode=peripheral 让 UDC 恒在，
#   USB 网络不依赖任何角色判定。
#   这与 docs/README.md「三条最重要的事」第 2 条及 AGENTS.md §8 决策表第 3 条一致
#   （那两处一直写的就是首刷 l0-safe；本文件在 2026-09-02 被改成 l0 时没有同步
#   文档，属于代码与文档脱节）。
#   确认整机可用后再切：sudo sed -i 's/^default .*/default l0/' 本文件 && sudo reboot

default l0-safe
menu title ODIN Debian (mainline 6.19)
timeout 30

label l0
    kernel /boot/vmlinuz
    initrd /boot/initramfs.cpio.gz
    fdt /boot/dtbs/qcom/msm8953-smartisan-odin-ft8716.dtb
    append console=ttyMSM0,115200n8 earlycon=msm_serial_dm,0x78af000 root=/dev/disk/by-label/pmOS_root rootwait rw console=tty0

label l0-safe
    kernel /boot/vmlinuz
    initrd /boot/initramfs.cpio.gz
    fdt /boot/dtbs/qcom/msm8953-smartisan-odin-ft8716-norolesw.dtb
    append console=ttyMSM0,115200n8 earlycon=msm_serial_dm,0x78af000 root=/dev/disk/by-label/pmOS_root rootwait rw console=tty0
