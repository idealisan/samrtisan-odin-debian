Syntax 4

SectionVerb {
	EnableSequence []
	DisableSequence []
	Value {
		PlaybackPCM "hw:0,0"
		CapturePCM  "hw:0,1"
		PlaybackChannels 2
		CaptureChannels  1
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker via external AW8738 amplifier"
	Value {
		PlaybackPCM "hw:0,0"
		PlaybackChannels 2
	}
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SPK DAC' 1"
		cset "name='RX1 Digital Volume' 84"
		cset "name='RX2 Digital Volume' 84"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Mic" {
	Comment "Built-in microphone (AMIC2 -> MIC BIAS Internal2)"
	Value {
		CapturePCM "hw:0,1"
		CaptureChannels 1
	}
	EnableSequence [
		cset "name='MultiMedia2 Mixer PRI_MI2S_TX' 1"
		cset "name='ADC2 MUX' 'AMIC2'"
		cset "name='ADC2' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer PRI_MI2S_TX' 0"
	]
}

SectionModifier."Playback" {
	EnableSequence []
	DisableSequence []
	SupportedDevice ["Speaker"]
}

SectionModifier."Capture" {
	EnableSequence []
	DisableSequence []
	SupportedDevice ["Mic"]
}
