# ODIN（Smartisan U2 Pro, msm8953）—— machine driver qcom-apq8016-sbc
#
# ⚠️ 控件名必须写 **cset 认的"原始名"**，不是 `amixer scontrols` 打印的"简化名"。
#    alsa-lib 的 simple 层会把 " Switch" / " Volume" / " Mux" 这类后缀剥掉，
#    于是 sget 能用的名字在 cset 里根本找不到元素。实测对照表：
#
#        amixer scontrols 显示     cset 要写的
#        ---------------------     ------------------------
#        SPK DAC                   SPK DAC Switch
#        RX3 Digital               RX3 Digital Volume
#        Ext Spk                   Ext Spk Switch
#        Earpiece                  Earpiece Switch
#        ADC2                      ADC2 Volume
#        ADC2 MUX                  ADC2 MUX        （两边一样）
#
# ⚠️ RXn Digital Volume 的刻度与 DB410c 不同。上游 apq8016-sbc 的 UCM 写 128，
#    本机是 `min=0 max=124`、1 dB/档、84 = 0 dB —— 照抄 128 会 -EINVAL，
#    `alsaucm set _dev Speaker` 就是这么失败的（只报 Invalid argument，不说是哪条）。
#
# 通路（照 msm8916-wcd-digital.c / msm8916-wcd-analog.c 的 route 表画的）：
#   播放 MultiMedia1 →(q6routing) PRI_MI2S_RX
#        → lpass_codec: AIF1 Playback → I2S RX1/2/3
#        → RXn MIX1 INP1(选 RX1) → RXn MIX1 → RXn INT → PDM_RXn
#        → wcd_codec: PDM_RXn
#          n=3 → LINEOUT DAC → LINEOUT(mux=Switch) → LINEOUT PA → LINEOUT_OUT
#                → 外置 AW 功放 → Ext Spk              ← 扬声器（大喇叭）
#                （PDM_RX3 也分一路去 SPK DAC → SPK PA → SPK_OUT，
#                  那是内部小喇叭用的；本机没接，见文件末尾说明）
#          n=1 → HPHL DAC → EAR PA → EAR_S(Switch) → EAR → Earpiece   ← 听筒
#   采集 AMIC1 → ADC1 → PDM_TX
#        → lpass_codec: DEC1 MUX(ADC1) → CIC1 MUX(AMIC) → I2S TX1 → AIF1 Capture
#        →(q6routing) MultiMedia2 Mixer **TERT_MI2S_TX** → MultiMedia2 Capture
#
# 采集侧两个坑（都是实测踩的）：
#   1. 后端是 msm8953.dtsi 里的 tertiary-mi2s-dai-link（TERTIARY_MI2S_TX），
#      不是 Primary。打开 PRI_MI2S_TX 时 hw:0,1 连 open 都会失败，报
#        MultiMedia2: ASoC: no backend DAIs enabled for MultiMedia2
#      然后 arecord 给一句 Invalid argument，完全看不出是混音器没配对。
#   2. 本机接的是 **ADC1（AMIC1）**，ADC2/ADC3 与本底齐平、两个 DMIC 恒为 0。
#      扫的时候只有 ADC1 有响应；后来把 `ADC1 Volume` 开到 8 再录音，
#      RMS 直接到 327（本底 1~2）—— 第一次扫只有 5.5 是因为**增益没开**。
#      ✅ 2026-09-04 已用耳朵确认：录放正常。
#
# ⚠️ 扬声器（大喇叭）还差最后一步：**外置功放是 AW87318 一类的 Awinic 功放，
#    它的 MODE 脚要打脉冲才开机**，不是拉高就行。主线用 `awinic,aw8738`
#    驱动（DTS 里 `awinic,mode = <6>`）在 POST_PMU 打 6 个上升沿。
#    若哪天换回 `simple-audio-amplifier`，GPIO 只会一直拉高 ⇒ 功放不开 ⇒ 没声，
#    而 DAPM 看起来一切正常（GPIO 也确实是 high）—— 这个坑排查起来很费时间。

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
	]
	Value {
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker (external amplifier on GPIO 132)"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX3 MIX1 INP1' RX1"
		## 84 = 0 dB（见文件头；上限 124 = +40 dB）
		cset "name='RX3 Digital Volume' 84"
		## LINEOUT_OUT ← LINEOUT PA ← LINEOUT(mux) ← LINEOUT DAC ← PDM_RX3
		## 这个 mux 不打 Switch，功放的输入端就没信号。
		## （SPK_OUT 那条是留给内部小喇叭的，本机扬声器不在那上面。）
		cset "name='LINEOUT' Switch"
		cset "name='Ext Spk Switch' on"
	]
	DisableSequence [
		cset "name='Ext Spk Switch' 0"
		cset "name='LINEOUT' ZERO"
		cset "name='RX3 MIX1 INP1' ZERO"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (WCD EAR, driven directly, no external amplifier)"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX1 MIX1 INP1' RX1"
		## 84 = 0 dB（同 Speaker）
		cset "name='RX1 Digital Volume' 84"
		cset "name='EAR_S' Switch"
		cset "name='Earpiece Switch' 1"
	]
	DisableSequence [
		cset "name='Earpiece Switch' 0"
		cset "name='EAR_S' ZERO"
		cset "name='RX1 MIX1 INP1' ZERO"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone (AMIC1 -> ADC1 -> DEC1 -> MultiMedia2)"

	EnableSequence [
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
		cset "name='DEC1 MUX' ADC1"
		cset "name='CIC1 MUX' AMIC"
		cset "name='ADC1 Volume' 8"
	]
	DisableSequence [
		cset "name='DEC1 MUX' ZERO"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
