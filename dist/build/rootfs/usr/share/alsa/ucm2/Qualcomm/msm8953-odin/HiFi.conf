# ODIN (Smartisan U2 Pro, msm8953) — machine driver qcom-apq8016-sbc
# 播放侧 AFE 通路靠 q6routing 控件；codec 内部到 SPK 走 RX3（照 apq8016-sbc 的写法）

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
	]
	Value {
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker (external AW8738 amplifier)"
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SPK DAC Switch' 1"
		cset "name='RX3 MIX1 INP1' RX1"
		cset "name='RX3 Digital Volume' 128"
	]
	DisableSequence [
		cset "name='SPK DAC Switch' 0"
		cset "name='RX3 MIX1 INP1' ZERO"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone"
	EnableSequence [
		cset "name='MultiMedia2 Mixer PRI_MI2S_TX' 1"
		cset "name='ADC2 MUX' 'AMIC2'"
		cset "name='ADC2' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer PRI_MI2S_TX' 0"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
