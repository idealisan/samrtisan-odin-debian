# ODIN 刷机产物构建 —— 只在发布 Release（含 Pre-release）时触发
#
# 刻意不挂 push / pull_request：内核要编几十分钟，rootfs 要走一遍 debootstrap，
# 每次提交都跑纯属浪费公共资源。要验证就发一个 pre-release。
#
# 三个外部依赖全部固定到具体 commit / tag，上游再动也不影响复现：
#   · 内核        msm8953-mainline/linux  @ 05f7e89ab9731565d8a62e3b5d1ec206485eeb0b（Linux 6.19）
#   · lk2nd       msm8916-mainline/lk2nd @ tag 23.1（设备上跑过的是
#                 21.0-r0-postmarketOS，但我们的 QCDT/面板补丁只对 23.x
#                 的 rules.mk 成立：19.x 的设备表条目与上下文完全不同，
#                 0002 打不上去）。注意不是 msm8953-mainline/lk2nd，
#                 那个仓库目录结构不一样。
#   · Debian      发行版套件 bookworm（debootstrap 现装，不依赖任何预置镜像）
#
# 产物（全部挂到该 Release 上）：
#   lk2nd.img / lk2nd-nomarkw.img   刷 boot 分区的二级引导（精简版强制命中 odin）
#   msm8953-smartisan-odin*.dtb ×4  设备树
#   odin-debian.img                 刷 userdata 的完整系统
#   odin-debian-sparse.img          同上 sparse 版，fastboot 分块传输用
#   SHA256SUMS                      全部产物的校验和

name: release-build

# 触发条件只挂 release，且刻意只用 prereleased + released 这两个事件：
# GitHub 发布一个 pre-release 时会**同时**发 published 与 prereleased，
# 发布正式版时会同时发 published 与 released —— 若把 published 也写上，
# 每次发布就会跑两遍（实测确实触发了两个 run）。
# prereleased 覆盖预发布、released 覆盖正式版，两者不重叠，正好各一次。
on:
  release:
    types: [prereleased, released]
  # 只多一个手动入口：调 CI 时不必为了触发而多发一个 Release 版本。
  # 不会有任何自动触发，因此不额外消耗资源。
  workflow_dispatch:

permissions:
  contents: write

env:
  # 上游基线 Linux 6.19（不是本地 odin-wip 的 HEAD —— 那个已经含我们的补丁）
  KERNEL_SHA: 05f7e89ab9731565d8a62e3b5d1ec206485eeb0b
  # 必须加引号：不加引号 YAML 会把 19.0 解析成浮点数 19，URL 就错了
  LK2ND_VER: "23.1"

jobs:
  # ------------------------------------------------------------------ 设备树
  dtb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 dtc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler
      - name: 编译四个 DTB
        run: bash tools/ci/build-dtb.sh out/dtb
      - uses: actions/upload-artifact@v4
        with:
          name: odin-dtb
          path: out/dtb/*.dtb

  # ------------------------------------------------- lk2nd（刷 boot 分区那个）
  lk2nd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ARM32 裸机工具链
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi device-tree-compiler libfdt-dev make
      - name: 构建完整版与精简版
        run: bash tools/ci/build-lk2nd.sh out/lk2nd
      - uses: actions/upload-artifact@v4
        with:
          name: odin-lk2nd
          path: out/lk2nd/*.img

  # ------------------------------------------------------------------ 内核
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 取 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # 内核源码 SHA + 补丁内容共同决定缓存键：任一方变了缓存自然失效。
          # 不能为了命中率牺牲正确性，所以 hashFiles('patches/*.patch') 必须留在 key 里。
          key: kernel-ccache-${{ env.KERNEL_SHA }}-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            kernel-ccache-${{ env.KERNEL_SHA }}-
            kernel-ccache-
      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev kmod cpio rsync patch ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z
      - name: 编译内核与模块
        run: bash tools/ci/build-kernel.sh out/kernel
      - uses: actions/upload-artifact@v4
        with:
          name: odin-kernel
          path: |
            out/kernel/vmlinuz
            out/kernel/modules.tar

  # ------------------------------------------------------------------ 系统镜像
  rootfs:
    runs-on: ubuntu-latest
    needs: [kernel, dtb]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 debootstrap 与 arm64 模拟执行环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static binfmt-support \
            e2fsprogs android-sdk-libsparse-utils kmod cpio parted
          # apt 装的 binfmt 条目不一定已注册进内核，chroot 进 arm64 根之前补一次
          sudo update-binfmts --enable qemu-aarch64
      - uses: actions/download-artifact@v4
        with: { name: odin-kernel, path: out/kernel }
      - uses: actions/download-artifact@v4
        with: { name: odin-dtb, path: out/dtb }
      - name: 组装系统镜像
        run: |
          # debootstrap / chroot / mke2fs 都必须以 root 运行，脚本本身不自己 sudo，
          # 由这里统一提权；跑完把产物交还给 runner，否则 upload-artifact 读不到
          # root 建的 0600 镜像
          sudo -E bash tools/ci/build-rootfs.sh out/rootfs out/kernel out/dtb
          sudo chown -R "$(id -u):$(id -g)" out/rootfs
      - uses: actions/upload-artifact@v4
        with:
          name: odin-rootfs
          path: |
            out/rootfs/odin-debian.img
            out/rootfs/odin-debian-sparse.img

  # ------------------------------------------------------------------ 挂到 Release
  publish:
    runs-on: ubuntu-latest
    needs: [dtb, lk2nd, rootfs]
    # 只挂 Release：手动调试时 github.event.release.tag_name 是空的，
    # 后面的 gh release upload 必然失败，会让整条 run 显示成红色。
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with: { name: odin-dtb, path: out }
      - uses: actions/download-artifact@v4
        with: { name: odin-lk2nd, path: out }
      - uses: actions/download-artifact@v4
        with: { name: odin-rootfs, path: out }
      - name: 生成校验和
        run: cd out && sha256sum * | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        # 必须显式给 -R：本 job 没有 actions/checkout（只需要产物、不需要源码），
        # 而 gh 在没有本地 .git 时无法推断仓库，会报
        #   failed to run git: fatal: not a git repository
        # 并让整条 run 染红 —— rc3 就是死在这里。
        run: gh release upload "$TAG" out/* -R "${{ github.repository }}" --clobber
